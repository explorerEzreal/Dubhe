services:
  reverse-proxy:
    image: nginx:1.27-alpine
    profiles: [tls]
    ports:
      - '${HTTP_BIND_ADDRESS:-0.0.0.0}:80:80'
      - '${HTTPS_BIND_ADDRESS:-0.0.0.0}:443:443'
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      cloud:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ../web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:5173:80'
    depends_on:
      cloud:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/']
      interval: 10s
      timeout: 3s
      retries: 5
  migrate:
    build: .
    command: ['node', '--import', 'tsx', 'scripts/migrate.ts']
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  cloud:
    build: .
    ports:
      - '${CLOUD_BIND_ADDRESS:-127.0.0.1}:3000:3000'
    environment:
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      WEB_BASE_URL: ${WEB_BASE_URL:?WEB_BASE_URL is required}
      AGENT_DOWNLOAD_URL: ${AGENT_DOWNLOAD_URL:?AGENT_DOWNLOAD_URL is required}
      AGENT_RELEASE_DIR: /app/releases
      AGENT_RELEASE_VERSION: ${AGENT_RELEASE_VERSION:-0.1.0}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      AGENT_REQUIRE_TLS: ${AGENT_REQUIRE_TLS:-true}
      AGENT_HEARTBEAT_TIMEOUT_MS: ${AGENT_HEARTBEAT_TIMEOUT_MS:-30000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cloud}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cloud} -d ${POSTGRES_DB:-cloud}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
