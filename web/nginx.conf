server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://cloud:3000;
    proxy_set_header Host $host;
  }

  location /v1/ {
    proxy_pass http://cloud:3000;
    proxy_set_header Host $host;
  }

  location /downloads/ {
    proxy_pass http://cloud:3000;
    proxy_set_header Host $host;
  }
}
