# Agent 开发验证示例。Agent 通常运行在模型设备，不随 Cloud 一起部署。
services:
  agent:
    build: .
    environment:
      CLOUD_URL: wss://api.example.com/agent
      LOCAL_MODEL_URL: http://host.docker.internal:8000
      MODELS: my-model
      CREDENTIALS_PATH: /var/lib/dubhe-agent/credentials.json
    volumes:
      - agent-data:/var/lib/dubhe-agent
    restart: unless-stopped

volumes:
  agent-data:
